<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f86f0"/>
      <stop offset="1" stop-color="#2c55b8"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b1e4d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px rounded square centred in a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- back sheet -->
  <rect x="318" y="226" width="430" height="560" rx="34" fill="#c9d8f7" transform="rotate(7 533 506)" filter="url(#shadow)"/>
  <!-- front sheet with folded corner -->
  <g filter="url(#shadow)">
    <path d="M300 236 h300 l120 120 v432 a34 34 0 0 1 -34 34 h-386 a34 34 0 0 1 -34 -34 v-518 a34 34 0 0 1 34 -34 z" fill="url(#page)"/>
    <path d="M600 236 v86 a34 34 0 0 0 34 34 h86 z" fill="#c9d8f7"/>
  </g>
  <!-- title + text lines -->
  <rect x="330" y="300" width="220" height="30" rx="15" fill="#2c55b8"/>
  <rect x="330" y="400" width="330" height="22" rx="11" fill="#b7c3d9"/>
  <rect x="330" y="456" width="330" height="22" rx="11" fill="#b7c3d9"/>
  <!-- highlighted line -->
  <rect x="318" y="498" width="356" height="50" rx="12" fill="#ffd400" opacity="0.85"/>
  <rect x="330" y="512" width="300" height="22" rx="11" fill="#7a6400" opacity="0.55"/>
  <rect x="330" y="568" width="330" height="22" rx="11" fill="#b7c3d9"/>
  <rect x="330" y="624" width="250" height="22" rx="11" fill="#b7c3d9"/>
  <rect x="330" y="680" width="290" height="22" rx="11" fill="#b7c3d9"/>
</svg>
